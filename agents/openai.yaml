interface:
  display_name: "手绘拼贴 · Hand-Drawn Collage"
  short_description: "把照片收成极简手绘纸拼贴：原图对照、纯手绘、或整页撕纸。"
  default_prompt: "Use $hand-drawn-collage to generate this photo as a minimal hand-drawn paper collage. If I have not chosen a version, ask: A original-plus-collage, B pure collage, or C full-page collage with poem. Use image generation. Do not draw SVG."
